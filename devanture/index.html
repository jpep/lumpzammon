<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>GOMMAN – Skin Preview</title>
  <!-- Noto Sans : fallback pour les nicknames qui contiennent des caractères
       non disponibles dans nortechico (japonais, chinois, arabe, etc.). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans&family=Noto+Sans+JP&family=Noto+Sans+SC&family=Noto+Sans+Arabic&display=swap">
  <style>
    /* Déclaration explicite de nortechico pour pouvoir l'utiliser en
       font-family CSS (utile pour la chaîne de fallback Noto Sans). */
    @font-face {
      font-family: 'nortechico';
      src: url('fonts/nortechico-100.otf') format('opentype');
      font-display: block;
    }
    /* nortechico-60 : version "light" utilisée pour les notices in-game
       (doublage promis, etc.) — chaîne CSS dédiée avec fallback Noto Sans. */
    @font-face {
      font-family: 'nortechico-60';
      src: url('fonts/nortechico-60.otf') format('opentype');
      font-display: block;
    }
    /* nortechico-80 : poids intermédiaire (utilisé par le titre G⌂MM⌂N
       de l'intro / menu / sign-in). */
    @font-face {
      font-family: 'nortechico-80';
      src: url('fonts/nortechico-80.otf') format('opentype');
      font-display: block;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      /* Fond initial NOIR (image image-less) : empêche que fond.jpg ne flash
         AVANT que le canvas ne soit prêt à dessiner le voile sombre + GOMMAN
         de l'intro. L'image de fond est posée par JS (sketch.js setup() /
         preload). On garde les propriétés de positionnement (center / cover
         / no-repeat) en CSS pour qu'elles s'appliquent dès que JS pose
         l'image — sinon on hérite des défauts (top-left, auto, repeat). */
      background-color: #000;
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    canvas { display: block; touch-action: none; }
    /* Masque l'écran "loading…" natif de p5.js */
    #p5_loading { display: none !important; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="mockState.js?v=222"></script>
  <script src="game/logic_standalone.js?v=222"></script>
  <script src="game/ai_standalone.js?v=222"></script>
  <script src="adapter.js?v=222"></script>
  <script src="dice.js?v=222"></script>
  <script src="sketch.js?v=222"></script>
</body>
</html>
